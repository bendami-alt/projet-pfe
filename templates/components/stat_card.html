<div class="stat-card">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="bg-primary bg-opacity-10 text-primary rounded-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
            <i class="fas fa-{{ icon }} fs-5"></i>
        </div>
        <span class="badge bg-success bg-opacity-10 text-success border-0 rounded-pill px-2 py-1" style="font-size: 0.7rem;">+12%</span>
    </div>
    <div class="stat-value">{{ value }}</div>
    <div class="text-muted small fw-600 text-uppercase" style="letter-spacing: 0.025em;">{{ label }}</div>
</div>
